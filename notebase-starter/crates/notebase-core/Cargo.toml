[package]
name = "notebase-core"
version = "0.7.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
walkdir = "2"
unicode-normalization = "0.1.26"
rusqlite = { version = "0.41", features = ["bundled", "functions", "backup"] }
memchr = "2.8.3"
comrak = { version = "0.57", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std"] }
notify = "8.2.1"
fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
